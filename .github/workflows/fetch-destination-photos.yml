name: Fetch Destination Photos

on:
  push:
    branches:
      - claude/destination-photos-wikimedia-1o4acd
    paths:
      - "scripts/fetch_destination_photos.py"
      - ".github/workflows/fetch-destination-photos.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        run: python scripts/fetch_destination_photos.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add destination_photos photo_credits.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add destination photos fetched from Wikimedia Commons"
            git push
          fi
